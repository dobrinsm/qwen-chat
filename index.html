<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>qwen27b chat</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #2d333b; --text: #e6edf3;
    --dim: #8b949e; --accent: #4f8ff7; --user: #1f6feb33; --err: #f85149;
    --ok: #3fb950; --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--border); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 14px; font-weight: 600; flex: 1; }
  #status { font-size: 11px; color: var(--dim); }
  #status.cold { color: var(--warn); }
  #status.ready { color: var(--ok); }
  #status.err { color: var(--err); }
  .hbtn {
    background: none; border: 1px solid var(--border); color: var(--dim);
    border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer;
  }
  .hbtn:hover { color: var(--text); border-color: var(--dim); }
  #banner {
    display: none; padding: 8px 14px; font-size: 13px;
    background: #2d2300; color: var(--warn); border-bottom: 1px solid var(--border);
  }
  #banner.show { display: block; }
  #chat { flex: 1; overflow-y: auto; padding: 18px 14px 10px; scroll-behavior: smooth; }
  .msg { max-width: 760px; margin: 0 auto 14px; }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; letter-spacing: .4px; text-transform: uppercase; }
  .msg .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.assistant .body { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 13px; }
  .msg.user .body { background: var(--user); border-radius: 10px; padding: 10px 13px; }
  .msg.error .body { color: var(--err); font-size: 13px; }
  .msg .body code { background: #21262d; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .msg .body pre {
    background: #010409; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0; white-space: pre;
  }
  .msg .body pre code { background: none; border: none; padding: 0; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent);
    vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #composer { border-top: 1px solid var(--border); background: var(--panel); padding: 10px 14px 14px; }
  #row { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font: inherit; resize: none;
    max-height: 160px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send, #stop {
    border: none; border-radius: 10px; padding: 10px 16px; font: inherit;
    font-weight: 600; cursor: pointer; color: #fff;
  }
  #send { background: var(--accent); }
  #send:disabled { opacity: .45; cursor: default; }
  #stop { background: var(--err); display: none; }
  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; width: min(440px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { font-size: 15px; margin-bottom: 12px; }
  dialog label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  dialog input[type="text"], dialog input[type="password"], dialog input[type="number"], dialog textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font: inherit; outline: none;
  }
  dialog textarea { resize: vertical; min-height: 70px; }
  dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  dialog .actions button {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 8px; padding: 7px 14px; cursor: pointer; font: inherit;
  }
  dialog .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>qwen27b · Huihui-Qwen3.8-27B (NVFP4)</h1>
  <span id="status">checking…</span>
  <button class="hbtn" id="btnSettings" title="Settings">⚙</button>
  <button class="hbtn" id="btnClear" title="Clear chat">clear</button>
</header>
<div id="banner">Worker is cold — waking RunPod GPU (first boot ≈ 2–7 min). You can type now; it will answer when warm.</div>
<div id="chat"></div>
<div id="composer">
  <div id="row">
    <textarea id="input" rows="1" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
    <button id="stop">Stop</button>
  </div>
</div>

<dialog id="dlg">
  <h2>Settings</h2>
  <label>System prompt</label>
  <textarea id="sSystem"></textarea>
  <label>Temperature: <span id="tVal">0.7</span></label>
  <input type="range" id="sTemp" min="0" max="2" step="0.1" value="0.7" style="width:100%">
  <label>Max tokens</label>
  <input type="number" id="sMax" value="4000" min="256" max="8000">
  <label>Context depth <span style="color:var(--dim)">(last N messages sent to the model)</span></label>
  <input type="number" id="sDepth" value="30" min="2" max="200">
  <label>Access code <span style="color:var(--dim)">(only if CHAT_ACCESS_CODE is set on Netlify)</span></label>
  <input type="password" id="sCode" placeholder="empty = none">
  <div class="actions">
    <button id="dlgWipe">wipe saved chat</button>
    <button id="dlgCancel">Cancel</button>
    <button id="dlgSave" class="primary">Save</button>
  </div>
</dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const chatEl = $("chat"), input = $("input"), sendBtn = $("send"), stopBtn = $("stop");
const statusEl = $("status"), banner = $("banner");
const MODEL_LABEL = "assistant";

let history = [];
try { history = JSON.parse(localStorage.getItem("qwenchat.history") || "[]"); } catch (_) { history = []; }
let controller = null, busy = false;

function save() { localStorage.setItem("qwenchat.history", JSON.stringify(history.slice(-60))); }

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderBody(text) {
  // minimal markdown: fenced code, inline code, bold, italics
  let out = esc(text);
  out = out.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (_, __, code) => `<pre><code>${code}</code></pre>`);
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  out = out.replace(/(^|\W)\*([^*\n]+)\*/g, "$1<i>$2</i>");
  return out;
}

function addMsg(role, text, streaming) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "error" ? "error" : role;
  const body = document.createElement("div");
  body.className = "body";
  if (streaming) { body.innerHTML = `<span class="cursor"></span>`; div._raw = ""; }
  else body.innerHTML = renderBody(text);
  div.appendChild(who); div.appendChild(body);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function streamAppend(div, chunk) {
  div._raw = (div._raw || "") + chunk;
  const body = div.querySelector(".body");
  body.innerHTML = renderBody(div._raw) + `<span class="cursor"></span>`;
  chatEl.scrollTop = chatEl.scrollHeight;
}
function streamEnd(div) {
  const body = div.querySelector(".body");
  body.innerHTML = renderBody(div._raw || "");
}

function setStatus(cls, text) { statusEl.className = cls; statusEl.textContent = text; }

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// POST /api/chat with cold-start handling: proxy returns 503 {cold:true} while
// the RunPod worker boots; we show a wake banner and auto-retry (~5 min max).
async function postChatWithWake(headers, payload) {
  const MAX_ATTEMPTS = 20; // 20 x 15s = 5 min of patience
  for (let attempt = 1; ; attempt++) {
    const res = await fetch("/api/chat", {
      method: "POST", headers, body: JSON.stringify(payload), signal: controller.signal,
    });
    if (res.ok) { banner.classList.remove("show"); return res; }
    let j = null;
    try { j = await res.json(); } catch (_) {}
    if (res.status === 503 && j && j.cold && attempt < MAX_ATTEMPTS) {
      banner.classList.add("show");
      const mins = Math.round(attempt * 0.25);
      banner.textContent = `GPU is waking (cold start ≈ 2–7 min). Waiting… ~${mins} min elapsed.`;
      setStatus("cold", "○ waking");
      await sleep(15000);
      continue;
    }
    if (res.status === 401) {
      localStorage.removeItem("qwenchat.code");
      throw new Error((j && j.error || "unauthorized") + " — set access code in ⚙ settings");
    }
    throw new Error((j && j.error) || `HTTP ${res.status}`);
  }
}

// ---- warm check (only on load / after errors — never poll) ----
async function checkWarm() {
  setStatus("", "checking…");
  try {
    const headers = {};
    const code = localStorage.getItem("qwenchat.code");
    if (code) headers["x-access-code"] = code;
    const r = await fetch("/api/warm", { headers });
    const j = await r.json();
    if (j.ready) { setStatus("ready", "● warm"); banner.classList.remove("show"); }
    else if (j.status === "cold" || j.status === 408 || j.status === "error") {
      setStatus("cold", "○ cold"); banner.classList.add("show");
    } else { setStatus("err", j.status || "no key"); }
  } catch (_) { setStatus("err", "unreachable"); }
}

// ---- sending ----
async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = ""; input.style.height = "auto";
  history.push({ role: "user", content: text });
  addMsg("user", text);
  save();
  busy = true; sendBtn.disabled = true; sendBtn.style.display = "none"; stopBtn.style.display = "";
  const div = addMsg("assistant", "", true);
  controller = new AbortController();
  let sawError = false;

  try {
    const headers = { "Content-Type": "application/json" };
    const code = localStorage.getItem("qwenchat.code");
    if (code) headers["x-access-code"] = code;

    const payload = {
      messages: history.slice(-parseInt(localStorage.getItem("qwenchat.depth") || "30", 10)),
      temperature: parseFloat(localStorage.getItem("qwenchat.temp") || "0.7"),
      max_tokens: parseInt(localStorage.getItem("qwenchat.max") || "4000", 10),
    };
    const sys = localStorage.getItem("qwenchat.system");
    if (sys) payload.messages = [{ role: "system", content: sys }, ...payload.messages];

    const res = await postChatWithWake(headers, payload);

    if (!res.ok || !(res.headers.get("content-type") || "").includes("event-stream")) {
      let msg = `HTTP ${res.status}`;
      try { const j = await res.json(); msg = j.error || msg; } catch (_) {}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    stream: for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith("data:")) continue;
        const dataStr = t.slice(5).trim();
        if (dataStr === "[DONE]") break stream;
        let j;
        try { j = JSON.parse(dataStr); } catch (_) { continue; }
        if (j.control === "done") break stream;
        if (j.error) { sawError = true; streamAppend(div, (div._raw ? "\n\n" : "") + "⚠ " + j.error); continue; }
        const delta = j.choices?.[0]?.delta;
        if (delta?.reasoning_content) continue; // hide thinking
        if (delta?.content) streamAppend(div, delta.content);
      }
    }
    streamEnd(div);
    const finalText = (div._raw || "").trim();
    if (sawError || !finalText) {
      if (!finalText) { div.querySelector(".body").innerHTML = "<i>(empty response — worker may still be booting; try again)</i>"; }
      checkWarm();
    } else {
      history.push({ role: "assistant", content: finalText });
      save();
    }
  } catch (e) {
    streamEnd(div);
    if (e.name === "AbortError") {
      const finalText = (div._raw || "").trim();
      if (finalText) { history.push({ role: "assistant", content: finalText }); save(); }
      div.querySelector(".body").innerHTML = renderBody((div._raw || "") + "\n\n[stopped]");
    } else {
      setStatus("err", "error");
      div.remove();
      addMsg("error", e.message || String(e));
      checkWarm();
    }
  } finally {
    busy = false; controller = null;
    sendBtn.style.display = ""; sendBtn.disabled = false; stopBtn.style.display = "none";
    input.focus();
  }
}

// ---- events ----
sendBtn.onclick = send;
stopBtn.onclick = () => controller && controller.abort();
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
$("btnClear").onclick = () => {
  if (!confirm("Clear this conversation?")) return;
  history = []; save(); chatEl.innerHTML = "";
};
$("btnSettings").onclick = () => {
  $("sSystem").value = localStorage.getItem("qwenchat.system") || "";
  $("sTemp").value = localStorage.getItem("qwenchat.temp") || "0.7";
  $("tVal").textContent = $("sTemp").value;
  $("sMax").value = localStorage.getItem("qwenchat.max") || "4000";
  $("sDepth").value = localStorage.getItem("qwenchat.depth") || "30";
  $("sCode").value = localStorage.getItem("qwenchat.code") || "";
  $("dlg").showModal();
};
$("sTemp").oninput = () => { $("tVal").textContent = $("sTemp").value; };
$("dlgCancel").onclick = () => $("dlg").close();
$("dlgSave").onclick = () => {
  localStorage.setItem("qwenchat.system", $("sSystem").value.trim());
  localStorage.setItem("qwenchat.temp", $("sTemp").value);
  localStorage.setItem("qwenchat.max", $("sMax").value);
  localStorage.setItem("qwenchat.depth", $("sDepth").value);
  const c = $("sCode").value.trim();
  if (c) localStorage.setItem("qwenchat.code", c); else localStorage.removeItem("qwenchat.code");
  $("dlg").close(); checkWarm();
};
$("dlgWipe").onclick = () => {
  localStorage.clear(); history = []; chatEl.innerHTML = ""; $("dlg").close();
};

// restore history on load
for (const m of history) addMsg(m.role, m.content, false);
if (!history.length) {
  addMsg("assistant", "Chat with the self-hosted Qwen3.8-27B (abliterated, NVFP4) on RunPod serverless.\n\nIf the badge says ○ cold, the first reply takes a few minutes while the GPU boots — after that it's fast. Settings (⚙): system prompt, temperature, max tokens.");
}
checkWarm();
input.focus();
</script>
</body>
</html>
